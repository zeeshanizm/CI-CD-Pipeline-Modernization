apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: portfolio-demo}
  template:
    metadata:
      labels: {app: portfolio-demo}
    spec:
      containers:
        - name: demo
          image: registry.example.com/portfolio/demo:replace-me
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: portfolio-demo}
spec:
  selector: {app: portfolio-demo}
  ports: [{port: 80, targetPort: 8080}]
